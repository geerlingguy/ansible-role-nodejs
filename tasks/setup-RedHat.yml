---
- name: Add Nodesource repository for Node.js.
  ansible.builtin.yum_repository:
    name: nodesource
    description: "Node.js Packages for Linux RPM based distros - {{ ansible_facts['architecture'] }}"
    baseurl: "https://rpm.nodesource.com/pub_{{ nodejs_version }}/nodistro/nodejs/{{ ansible_facts['architecture'] }}"
    enabled: true
    gpgcheck: true
    gpgkey: https://rpm.nodesource.com/gpgkey/ns-operations-public.key
    priority: 9
    module_hotfixes: true
  when: ansible_facts.distribution_major_version | int >= 7
  register: node_repo

- name: Update package cache if repo was added.
  yum:
    update_cache: true
  when: node_repo is changed
  tags: ['skip_ansible_lint']

- name: Ensure Node.js AppStream module is disabled (CentOS 8+).
  command: yum module disable -y nodejs
  register: module_disable
  changed_when: "'Nothing to do.' not in module_disable.stdout"
  when: ansible_facts.distribution_major_version | int >= 8

- name: Ensure Node.js and npm are installed.
  yum:
    name: "nodejs-{{ nodejs_version | regex_replace('x', '') }}*"
    state: present
    enablerepo: nodesource
